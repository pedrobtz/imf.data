# The pkgdown site, built on every pull request and deployed from main and
# from each release. CLAUDE.md and AGENTS.md are kept off it; see
# https://github.com/pedrobtz/r-actions#pkgdownyml--the-site-without-the-agent-instructions
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

jobs:
  pkgdown:
    # Decided without a runner. A documentation-only change still builds the
    # site, so `ci:docs` is not tested here; `ci:minimal` and the workflow's
    # own label skip it.
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:pkgdown'))
    # Deploys queue rather than cancel one another; pull requests run apart.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    uses: pedrobtz/r-actions/.github/workflows/pkgdown.yml@v1
